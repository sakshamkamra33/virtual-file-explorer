version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: file_explorer_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: file_explorer_frontend
    ports:
      - "5173:80" # Maps local port 5173 to Nginx port 80
    depends_on:
      - server
    restart: unless-stopped
